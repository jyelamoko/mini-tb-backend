
services:
  mini-tb-db:
    image: postgres:17
    container_name: mini-tb-db
    restart: always
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test123
      POSTGRES_DB: minitb
    ports:
      - "5432:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql # auto import
    networks:
      - mini-tb-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d minitb"]
      interval: 5s
      timeout: 5s
      retries: 5

  mini-tb-backend:
    build: .
    container_name: mini-tb-backend
    depends_on:
      mini-tb-db:
        condition: service_healthy
    ports:
      - "9001:9001"
    environment:
      QUARKUS_DATASOURCE_JDBC_URL: jdbc:postgresql://mini-tb-db:5432/minitb
      QUARKUS_DATASOURCE_USERNAME: test
      QUARKUS_DATASOURCE_PASSWORD: test123
    networks:
      - mini-tb-net

networks:
  mini-tb-net:
    driver: bridge
